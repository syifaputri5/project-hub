<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fffaf3; --paper:#ffffff; --ink:#2b2340; --muted:#8a819f; --line:#f0e8dc;
  --grape:#7c5cff; --grape-soft:#efeaff;
  --c0:#a3a9c2; --c1:#ff9f5a; --c2:#ffc93c; --c3:#2ec4b6; --c4:#4d96ff; --c5:#c77dff; --c6:#36c275; --coff:#ff5d8f;
  --shadow:0 10px 30px rgba(124,92,255,.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#17142200; --paper:#231d33; --ink:#f4f0ff; --muted:#a59cc0; --line:#352c4b; --grape-soft:#2f2650; --shadow:0 10px 30px rgba(0,0,0,.35); }
  :root:not([data-theme="light"]) body{background:#171422}
}
:root[data-theme="dark"]{ --paper:#231d33; --ink:#f4f0ff; --muted:#a59cc0; --line:#352c4b; --grape-soft:#2f2650; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:600 14px/1.45 Nunito,system-ui,sans-serif;
  background-image:radial-gradient(circle at 10% 0%,#ffe1ec 0,transparent 35%),radial-gradient(circle at 100% 20%,#dff3ff 0,transparent 30%),radial-gradient(circle at 50% 100%,#e9ffe5 0,transparent 35%);background-attachment:fixed}
h1,h2,h3,.fred{font-family:Fredoka,Nunito,sans-serif}
.wrap{max-width:1320px;margin:0 auto;padding:18px 24px 40px}
@media (max-width:700px){.wrap{padding:14px 16px 30px}}
.tabs{display:flex;gap:4px;background:var(--paper);padding:5px;border-radius:16px;box-shadow:var(--shadow);margin-left:18px}
.tabs button{border:0;background:none;color:var(--muted);font:800 13px Nunito;padding:8px 14px;border-radius:12px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.tabs button.on{background:#2b2340;color:#fff}
.tabs svg{width:16px;height:16px}
.newbtn{border:0;border-radius:14px;padding:10px 16px;font:800 13px Nunito;color:#fff;background:linear-gradient(135deg,#7c5cff,#ff6fa5);box-shadow:0 8px 20px rgba(124,92,255,.35);cursor:pointer;white-space:nowrap}
@media (max-width:980px){.head{flex-wrap:wrap}.tabs{order:9;margin:10px 0 0;width:100%;overflow-x:auto}}
.hero{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-top:18px}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.hero .mood{margin:0}
.quick{display:grid;gap:10px}
.qcard{border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;color:#2b2340}
.qcard .big{font-family:Fredoka;font-size:28px;font-weight:700;min-width:44px}
.qcard .l{font-weight:800}.qcard .s{font-size:11.5px;opacity:.7}
.road{display:flex;align-items:flex-start;gap:0;overflow-x:auto;padding:14px 4px 6px;background:var(--paper);border-radius:22px;box-shadow:var(--shadow)}
.stop{flex:1;min-width:104px;text-align:center;position:relative;cursor:pointer;padding:0 4px 8px}
.stop::before{content:"";position:absolute;top:27px;left:-50%;width:100%;height:4px;background:repeating-linear-gradient(to right,var(--line) 0 8px,transparent 8px 14px);z-index:0}
.stop:first-child::before{display:none}
.stop .bubble{margin:0 auto 8px;width:56px;height:56px}
.stop .nm{font-weight:800;font-size:12.5px}
.stop .hint{font-size:11px;color:var(--muted)}
.stop.zero .bubble{opacity:.4;box-shadow:none}
.stop.on .bubble{transform:scale(1.12) rotate(-5deg);outline:4px solid var(--paper);box-shadow:0 0 0 7px var(--sc)}
.stop .faces{justify-content:center;margin:6px 0 0 7px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:14px}
.cfgbar{margin-top:14px;border-radius:16px;padding:12px 14px;background:#2b2340;color:#fff;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.cfgbar button{border:0;border-radius:12px;padding:8px 14px;font:800 13px Nunito;background:#ffc93c;color:#2b2340;cursor:pointer}

/* header */
.head{display:flex;align-items:center;gap:10px}
.sun{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#ff8fb1,#ffc56b);display:grid;place-items:center;box-shadow:0 6px 16px rgba(255,140,170,.4);transform:rotate(-6deg)}
.sun svg{width:24px;height:24px}
.head h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.3px}
.head .tag{font-size:12px;color:var(--muted)}
.grow{flex:1}
.iconbtn{border:0;width:36px;height:36px;border-radius:12px;background:var(--paper);box-shadow:var(--shadow);cursor:pointer;color:var(--ink);display:grid;place-items:center}
select.tbl{border:0;border-radius:12px;background:var(--paper);color:var(--ink);padding:8px 10px;font:inherit;box-shadow:var(--shadow);max-width:170px}

/* mood bar */
.mood{margin:14px 0 6px;border-radius:22px;padding:16px;background:#2b2340;color:#fff;position:relative;overflow:hidden}
.mood h2{margin:0;font-size:19px;font-weight:600}
.mood p{margin:4px 0 0;opacity:.8;font-size:13px}
.mood .confetti span{position:absolute;border-radius:50%;opacity:.9}
.health{display:flex;height:10px;border-radius:99px;overflow:hidden;margin-top:12px;background:rgba(255,255,255,.12)}
.health i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:11px;opacity:.85}
.legend b{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}

/* journey */
.secttl{display:flex;align-items:baseline;gap:8px;margin:20px 2px 10px}
.secttl h3{margin:0;font-size:16px;font-weight:600}
.secttl .sub{color:var(--muted);font-size:12px}
.journey{position:relative;padding:4px 0}
.station{display:grid;grid-template-columns:54px 1fr;gap:12px;align-items:center;position:relative;padding:6px 0;cursor:pointer}
.station::before{content:"";position:absolute;left:26px;top:-6px;bottom:-6px;width:4px;background:repeating-linear-gradient(to bottom,var(--line) 0 6px,transparent 6px 12px)}
.station:first-child::before{top:50%}.station:last-child::before{bottom:50%}
.bubble{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-family:Fredoka;font-weight:700;font-size:20px;color:#fff;position:relative;z-index:1;box-shadow:0 8px 18px -6px var(--sc);transition:transform .2s}
.station:hover .bubble{transform:scale(1.07) rotate(-4deg)}
.station.zero .bubble{opacity:.45;box-shadow:none}
.stinfo{background:var(--paper);border-radius:16px;padding:9px 12px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;min-height:54px}
.stinfo .nm{font-weight:800}
.stinfo .hint{font-size:11.5px;color:var(--muted)}
.faces{display:flex;margin-left:auto}
.face{width:24px;height:24px;border-radius:50%;border:2px solid var(--paper);margin-left:-7px;display:grid;place-items:center;color:#fff;font-size:9.5px;font-weight:800}
.station.open .stinfo{outline:2px solid var(--sc)}
.drawer{margin:4px 0 10px 66px;display:grid;gap:8px}

/* project ticket */
.ticket{background:var(--paper);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow);display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;cursor:pointer;position:relative;overflow:hidden}
.ticket:hover{transform:translateY(-1px)}
.ring{width:40px;height:40px}
.ticket .tt{font-weight:800;line-height:1.25}
.ticket .row{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;align-items:center;font-size:11px;color:var(--muted)}
.tagp{border-radius:8px;padding:1px 7px;font-weight:800;font-size:10.5px;color:#fff}
.soft{border-radius:8px;padding:1px 7px;font-weight:800;font-size:10.5px;background:var(--grape-soft);color:var(--grape)}
.warn{background:#ffe3ec;color:#d63a6a}

/* people */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.person{background:var(--paper);border-radius:18px;padding:12px;box-shadow:var(--shadow);cursor:pointer;border:2px solid transparent}
.person.on{border-color:var(--grape)}
.person .top{display:flex;align-items:center;gap:9px}
.avatar{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;color:#fff;font-family:Fredoka;font-weight:700}
.person .n{font-weight:800}.person .c{font-size:11.5px;color:var(--muted)}
.mini{display:flex;height:8px;border-radius:99px;overflow:hidden;margin-top:10px;background:var(--line)}
.mini i{display:block;height:100%}

/* needs love */
.lovegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.lovecard{border-radius:18px;padding:12px;cursor:pointer;color:#2b2340}
.lovecard .big{font-family:Fredoka;font-size:28px;font-weight:700;line-height:1}
.lovecard .l{font-weight:800;font-size:12.5px;margin-top:4px}
.lovecard.on{outline:3px solid #2b2340}

/* spotlight */
.spot{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x mandatory}
.spotcard{min-width:220px;max-width:240px;scroll-snap-align:start;border-radius:20px;padding:14px;color:#fff;cursor:pointer;position:relative;overflow:hidden}
.spotcard .tt{font-family:Fredoka;font-weight:600;font-size:15px;line-height:1.25}
.spotcard .meta{font-size:11.5px;opacity:.9;margin-top:8px}
.spotcard .badge{position:absolute;right:10px;top:10px;background:rgba(255,255,255,.25);border-radius:10px;padding:2px 8px;font-weight:800;font-size:11px}

/* requests */
.reqs{display:grid;gap:8px}
.req{background:var(--paper);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;cursor:pointer}
.req .dot{width:10px;height:10px;border-radius:50%;flex:none}
.req .tt{font-weight:800}.req .s{font-size:11.5px;color:var(--muted)}

/* dock nav */
.dock{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);background:var(--ink);border-radius:20px;padding:6px;display:flex;gap:4px;box-shadow:0 12px 30px rgba(43,35,64,.35);z-index:9}
.dock button{border:0;background:none;color:#cfc8e6;font:800 12px Nunito;padding:8px 12px;border-radius:14px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.dock button.on{background:#fff;color:var(--ink)}
.dock svg{width:16px;height:16px}
.fab{position:fixed;right:14px;bottom:76px;border:0;border-radius:18px;padding:12px 16px;font:800 13px Nunito;color:#fff;background:linear-gradient(135deg,#7c5cff,#ff6fa5);box-shadow:0 10px 24px rgba(124,92,255,.45);cursor:pointer;z-index:9}
.search{width:100%;border:0;border-radius:14px;background:var(--paper);box-shadow:var(--shadow);padding:11px 14px;font:inherit;color:var(--ink);margin-top:8px}
.empty{text-align:center;color:var(--muted);padding:26px}
.loading{min-height:60vh;display:grid;place-items:center;color:var(--muted);font-weight:800;text-align:center}
.bounce{display:flex;gap:6px;justify-content:center;margin-bottom:10px}
.bounce i{width:12px;height:12px;border-radius:50%;animation:b .9s infinite alternate}
.bounce i:nth-child(2){animation-delay:.15s}.bounce i:nth-child(3){animation-delay:.3s}
@keyframes b{to{transform:translateY(-10px)}}
.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:12px;font-weight:800;display:none;z-index:20}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="sun"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></div>
    <div><h1 id="title">Project Hub</h1><div class="tag" id="tag">Warming up...</div></div>
    <nav class="tabs" id="dock">
      <button data-tab="journey" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h7a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h7"/></svg>Journey</button>
      <button data-tab="crew"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5M15 15c3 0 6 1.5 6 4"/></svg>Crew</button>
      <button data-tab="love"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>Needs Love</button>
      <button data-tab="inbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M3 13l3-8h12l3 8v6H3z"/><path d="M3 13h5l1 2h6l1-2h5"/></svg>Inbox</button>
    </nav>
    <div class="grow"></div>
    <select class="tbl" id="tablePick" title="Which table to read"></select>
    <button class="iconbtn" id="refresh" title="Refresh"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg></button>
    <button class="newbtn" id="fab">+ New Request</button>
  </div>
  <div id="cfg"></div>
  <div id="main"><div class="loading"><div><div class="bounce"><i style="background:#ff8fb1"></i><i style="background:#ffc93c"></i><i style="background:#4d96ff"></i></div>Packing your projects into little suitcases...</div></div></div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { bitable } from 'https://esm.sh/@lark-base-open/js-sdk@1.0.2';

const STAGES = [
  { label:'Backlog',         c:'--c0', hint:'Waiting for its turn',         match:/backlog|next to do|to do|new|request/i },
  { label:'PRD',             c:'--c1', hint:'Being written by a BA',         match:/prd|draft|in making|review/i },
  { label:'Approved',        c:'--c2', hint:'Signed off, ready to hand over', match:/approv/i },
  { label:'Submitted to IT', c:'--c3', hint:'In IT\'s hands',                match:/submit|brief/i },
  { label:'In Development',  c:'--c4', hint:'Being built',                   match:/ongoing it|develop|in dev|sit|qa/i },
  { label:'UAT',             c:'--c5', hint:'Business is testing',           match:/uat/i },
  { label:'Deployed',        c:'--c6', hint:'Live in production',            match:/deploy|live|done|released/i },
];
const OFFRX = /cancel|hold|drop|reject/i;
const stageOf = s => { if (!s) return -1; if (OFFRX.test(s)) return -2; for (const i of [5,4,3,2,6,1,0]) if (STAGES[i].match.test(s)) return i; return 0; };
const PRI = { P0:'#ff4f7b', P1:'#ff8a3d', P2:'#f2b705', P3:'#4d96ff' };
const FACE = ['#ff8fb1','#7c5cff','#2ec4b6','#4d96ff','#ff9f5a','#c77dff','#36c275','#f2b705'];
const LINES = [
  ['Smooth sailing today','Projects are hopping along nicely.'],
  ['Look at you go','The pipeline is buzzing like a happy beehive.'],
  ['Tiny steps, big wins','Every status change counts. Keep it rolling.'],
  ['Fresh day, fresh progress','Grab a coffee and nudge one card forward.'],
];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cssv = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const hash = s => [...s].reduce((a,c)=>(a*33+c.charCodeAt(0))>>>0,5);
const faceColor = n => FACE[hash(n)%FACE.length];
const initials = n => n.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase() || '?';
const toast = m => { const t=$('#toast'); t.textContent=m; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',2000); };
const parseDate = v => { if (v==null||v==='') return null; if (typeof v==='number') return new Date(v); const m=String(v).match(/(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/); return m?new Date(+m[1],+m[2]-1,+m[3]):null; };
const fmt = d => d ? d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}) : '';
const daysSince = d => d ? Math.max(0,Math.floor((Date.now()-d)/864e5)) : null;
const ls = (k,v) => { try { return v===undefined ? localStorage.getItem(k) : localStorage.setItem(k,v); } catch { return null; } };

function findField(metas,...c){ const n=s=>s.toLowerCase().replace(/[^a-z0-9]/g,''); for(const x of c){const f=metas.find(m=>n(m.name)===n(x)); if(f) return f;} for(const x of c){const f=metas.find(m=>n(m.name).includes(n(x))); if(f) return f;} return null; }
async function readAll(table){ const out=[]; let pageToken; do { const r=await table.getRecordsByPage({pageSize:200,pageToken,stringValue:true}); out.push(...r.records); pageToken=r.hasMore?r.pageToken:undefined; } while(pageToken); return out; }

const S = { tab:'journey', open:null, person:null, love:null, q:'', P:[], R:[], tables:[], tableId:null, reqId:null, name:'' };

// ---------- data adapter: inside Lark (SDK) or on the standalone website (our API + Lark login) ----------
const IN_FRAME = (()=>{ try { return window.top !== window; } catch { return true; } })();
const HAS_API = !IN_FRAME && !/github\.io$/.test(location.hostname);
class NeedLogin extends Error {}
async function j(u){ const r=await fetch(u,{credentials:'same-origin'}); if(r.status===401) throw new NeedLogin('login'); if(!r.ok) throw new Error((await r.text()).slice(0,200)); return r.json(); }
let CFG = {};
const API = HAS_API ? {
  tables: () => j('/api/tables'),
  fields: t => j('/api/fields?table='+encodeURIComponent(t)),
  records: t => j('/api/records?table='+encodeURIComponent(t)),
} : {
  tables: async () => (await bitable.base.getTableMetaList()).map(t=>({id:t.id,name:t.name})),
  fields: async t => (await (await bitable.base.getTableById(t)).getFieldMetaList()).map(f=>({id:f.id,name:f.name})),
  records: async t => (await readAll(await bitable.base.getTableById(t))).map(r=>({id:r.recordId,fields:r.fields})),
};
function showLogin(){
  $('#main').innerHTML = `<div class="loading"><div style="max-width:380px">
    <div class="sun" style="width:64px;height:64px;margin:0 auto 14px;border-radius:20px"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" style="width:34px;height:34px"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></div>
    <h2 class="fred" style="margin:0 0 6px;color:var(--ink)">Welcome to Project Hub</h2>
    <p style="margin:0 0 16px">Sign in with your Lark account to see the projects you have access to.</p>
    <a class="newbtn" href="/api/login" style="display:inline-block;text-decoration:none">Sign in with Lark</a></div></div>`;
  $('#tag').textContent='Please sign in';
}

async function load(tableId){
  S.tables = await API.tables();
  const pick = S.tables.find(t=>t.id===tableId) || S.tables.find(t=>t.id===ls('ph_table')) || S.tables.find(t=>/project tracker/i.test(t.name)) || S.tables[0];
  S.tableId = pick.id; S.name = pick.name;
  $('#tablePick').innerHTML = S.tables.map(t=>`<option value="${t.id}" ${t.id===pick.id?'selected':''}>${esc(t.name)}</option>`).join('');
  const M = await API.fields(pick.id);
  const F = { title:findField(M,'Project Title','Project Name','Title','Name'), status:findField(M,'Status'), pri:findField(M,'Priority'),
    pic:findField(M,'PIC','Owner','Assignee'), team:findField(M,'Request Team','Team','Division','Requestor','Requester'),
    health:findField(M,'Health'), risk:findField(M,'Blocker / Risk','Blocker','Risk'), target:findField(M,'Target Release','Target Go-Live','Target'),
    d3:findField(M,'Submitted to IT Date'), d4:findField(M,'IT Start Date'), d6:findField(M,'Deployment Date','Deploy Date','Go-Live Date') };
  const g=(r,f)=>f?(r.fields[f.id]??''):'';
  S.P = (await API.records(pick.id)).map(r=>{
    const status=String(g(r,F.status)).trim(), st=stageOf(status);
    const dates={3:parseDate(g(r,F.d3)),4:parseDate(g(r,F.d4)),6:parseDate(g(r,F.d6))};
    return { id:r.id, title:String(g(r,F.title)).trim()||'Untitled project', status, st,
      pri:(String(g(r,F.pri)).match(/P[0-3]/i)||[''])[0].toUpperCase(),
      pics:String(g(r,F.pic)).split(/,\s*/).map(s=>s.trim()).filter(Boolean), team:String(g(r,F.team)).trim(),
      health:String(g(r,F.health)).trim(), risk:String(g(r,F.risk)).trim(), target:parseDate(g(r,F.target)),
      since: dates[st] || (st===5?dates[4]:null) };
  });
  const rq = S.tables.find(t=>/request/i.test(t.name) && t.id!==S.tableId); S.reqId = rq?.id||null; S.R=[];
  if (rq) try {
    const m=await API.fields(rq.id);
    const RF={title:findField(m,'Project Title','Request Title','Title','Name'),type:findField(m,'Request Type','Type'),team:findField(m,'Team / Division','Team','Division'),by:findField(m,'Requester','Requestor','Submitted By','Created By'),date:findField(m,'Request Date','Submitted On','Created Time','Created At','Date')};
    S.R=(await API.records(rq.id)).map(r=>({id:r.id,title:String(g(r,RF.title)).trim()||'Untitled request',type:String(g(r,RF.type)).trim(),team:String(g(r,RF.team)).trim(),by:String(g(r,RF.by)).trim(),date:parseDate(g(r,RF.date))})).sort((a,b)=>(b.date||0)-(a.date||0));
  } catch(e){ console.warn(e); }
}

// ---------- pieces ----------
function ring(p){
  const pct = p.st===-2?0 : p.st<0?0 : (p.st+1)/STAGES.length;
  const col = p.st===-2?cssv('--coff'):p.st<0?cssv('--c0'):cssv(STAGES[p.st].c);
  const r=16, C=2*Math.PI*r;
  return `<svg class="ring" viewBox="0 0 40 40"><circle cx="20" cy="20" r="${r}" fill="none" stroke="${cssv('--line')}" stroke-width="5"/><circle cx="20" cy="20" r="${r}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C*pct} ${C}" transform="rotate(-90 20 20)"/><text x="20" y="24" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="11" fill="${col}">${p.st>=0?p.st+1:'-'}</text></svg>`;
}
function ticket(p){
  const d=daysSince(p.since), late=p.target&&p.st!==6&&p.target<Date.now();
  return `<div class="ticket" data-id="${p.id}">${ring(p)}<div><div class="tt">${esc(p.title)}</div><div class="row">
    ${p.pri?`<span class="tagp" style="background:${PRI[p.pri]}">${p.pri}</span>`:''}
    <span>${esc(p.status||'No status')}</span>
    ${d!=null?`<span class="soft">${d}d here</span>`:''}
    ${late?`<span class="soft warn">Overdue</span>`:p.target?`<span>Due ${fmt(p.target)}</span>`:''}
    ${p.health&&!/on track/i.test(p.health)?`<span class="soft warn">${esc(p.health)}</span>`:''}
    <span>${p.pics.length?esc(p.pics.map(n=>n.split(' ')[0]).join(', ')):'No PIC'}</span>
  </div></div></div>`;
}
const faces = list => { const ns=[...new Set(list.flatMap(p=>p.pics))].slice(0,4); return ns.map(n=>`<span class="face" style="background:${faceColor(n)}" title="${esc(n)}">${initials(n)}</span>`).join(''); };
const filtered = () => S.P.filter(p=>(!S.person||(S.person==='Unassigned'?!p.pics.length:p.pics.includes(S.person))) && (!S.q || (p.title+' '+p.status+' '+p.team+' '+p.pics.join(' ')).toLowerCase().includes(S.q.toLowerCase())));

function mood(){
  const P=S.P, n=P.length||1, L=LINES[new Date().getDate()%LINES.length];
  const moving=P.filter(p=>p.st>=1&&p.st<=5).length, live=P.filter(p=>p.st===6).length;
  const segs=[...STAGES.map((s,i)=>[cssv(s.c),P.filter(p=>p.st===i).length,s.label]),[cssv('--coff'),P.filter(p=>p.st===-2).length,'Paused']];
  return `<div class="mood"><div class="confetti"><span style="width:60px;height:60px;right:-14px;top:-18px;background:#ff8fb1"></span><span style="width:26px;height:26px;right:56px;top:12px;background:#ffc93c"></span><span style="width:14px;height:14px;right:30px;bottom:14px;background:#2ec4b6"></span></div>
    <h2>${L[0]}</h2><p>${L[1]} <b>${moving}</b> in motion, <b>${live}</b> already live.</p>
    <div class="health">${segs.map(([c,k])=>k?`<i style="width:${k/n*100}%;background:${c}"></i>`:'').join('')}</div>
    <div class="legend">${segs.filter(s=>s[1]).map(([c,k,l])=>`<span><b style="background:${c}"></b>${l} ${k}</span>`).join('')}</div></div>`;
}

function viewJourney(){
  const P=filtered();
  const spot=S.P.filter(p=>p.pri==='P0'&&p.st!==6&&p.st!==-2);
  const grads=['linear-gradient(135deg,#ff6f91,#ff9671)','linear-gradient(135deg,#845ec2,#d65db1)','linear-gradient(135deg,#0089ba,#2ec4b6)','linear-gradient(135deg,#ff9f1c,#ffbf69)'];
  const stations=[...STAGES.map((s,i)=>({i,label:s.label,hint:s.hint,c:s.c})),{i:-2,label:'Paused',hint:'On hold or cancelled',c:'--coff'}];
  if (S.open==null) S.open = [4,5,3,2,1,0,6].find(i=>S.P.some(p=>p.st===i)) ?? 0;
  const now=Date.now(), in30=now+30*864e5;
  const overdue=S.P.filter(p=>p.target&&p.target<now&&p.st!==6&&p.st!==-2).length;
  const dueSoon=S.P.filter(p=>p.target&&p.target>=now&&p.target<=in30&&p.st!==6).length;
  const nopic=S.P.filter(p=>!p.pics.length&&p.st!==6&&p.st!==-2).length;
  const shown = S.q ? P : P.filter(p=>p.st===S.open);
  const cur = stations.find(s=>s.i===S.open);
  return `<div class="hero">${mood()}<div class="quick">
      <div class="qcard" data-love="overdue" style="background:#ffd6e2"><div class="big">${overdue}</div><div><div class="l">Past target date</div><div class="s">Give these a nudge</div></div></div>
      <div class="qcard" style="background:#fff0c7"><div class="big">${dueSoon}</div><div><div class="l">Due in 30 days</div><div class="s">Coming up soon</div></div></div>
      <div class="qcard" data-love="nopic" style="background:#e4ddff"><div class="big">${nopic}</div><div><div class="l">Waiting for a PIC</div><div class="s">Needs an owner</div></div></div>
    </div></div>` +
  (spot.length?`<div class="secttl"><h3>P0 spotlight</h3><span class="sub">${spot.length} top priority, still in flight</span></div><div class="spot">${spot.map((p,k)=>`<div class="spotcard" data-id="${p.id}" style="background:${grads[k%grads.length]}"><span class="badge">P0</span><div class="tt">${esc(p.title)}</div><div class="meta">${esc(p.status)}${p.pics.length?' · '+esc(p.pics[0].split(' ')[0]):''}${p.target?' · due '+fmt(p.target):''}</div></div>`).join('')}</div>`:'') +
  `<div class="secttl"><h3>The road to production</h3><span class="sub">click a stop to see who is there</span></div>
   <div class="road">${stations.map(s=>{const list=P.filter(p=>p.st===s.i);
     return `<div class="stop ${list.length?'':'zero'} ${S.open===s.i&&!S.q?'on':''}" data-st="${s.i}" style="--sc:var(${s.c})"><div class="bubble" style="background:var(${s.c})">${list.length}</div><div class="nm">${s.label}</div><div class="hint">${s.hint}</div><div class="faces">${faces(list)}</div></div>`;}).join('')}</div>
   <div class="secttl"><h3>${S.q?'Search results':esc(cur?.label||'')}</h3><span class="sub">${shown.length} project${shown.length===1?'':'s'}</span><div class="grow"></div></div>
   <input class="search" id="q" placeholder="Search every project, person or team..." value="${esc(S.q)}">
   <div class="tgrid">${shown.sort((a,b)=>(a.pri||'P9').localeCompare(b.pri||'P9')).map(ticket).join('')||'<div class="empty">Nobody here right now. Enjoy the quiet!</div>'}</div>`;
}

function viewCrew(){
  const m=new Map(); for(const p of S.P) for(const n of (p.pics.length?p.pics:['Unassigned'])) { if(!m.has(n)) m.set(n,[]); m.get(n).push(p); }
  const crew=[...m].sort((a,b)=>b[1].length-a[1].length);
  const mine = S.person ? (m.get(S.person)||[]) : [];
  return `<div class="secttl"><h3>The crew</h3><span class="sub">who is carrying what</span></div>
  <div class="people">${crew.map(([n,list])=>{const act=list.filter(p=>p.st>=1&&p.st<=5).length;
    return `<div class="person ${S.person===n?'on':''}" data-person="${esc(n)}"><div class="top"><div class="avatar" style="background:${n==='Unassigned'?'#b9b3c9':faceColor(n)}">${n==='Unassigned'?'?':initials(n)}</div><div><div class="n">${esc(n)}</div><div class="c">${list.length} projects · ${act} active</div></div></div>
    <div class="mini">${STAGES.map(s=>{const k=list.filter(p=>p.st===STAGES.indexOf(s)).length;return k?`<i style="width:${k/list.length*100}%;background:var(${s.c})"></i>`:''}).join('')}</div></div>`}).join('')}</div>
  ${S.person?`<div class="secttl"><h3>${esc(S.person.split(' ')[0])}'s board</h3><span class="sub">${mine.length} projects</span></div><div class="reqs">${mine.sort((a,b)=>b.st-a.st).map(ticket).join('')}</div>`:''}`;
}

function viewLove(){
  const now=Date.now();
  const buckets=[
    ['overdue','Past target date','#ffd6e2',p=>p.target&&p.target<now&&p.st!==6&&p.st!==-2],
    ['risk','At risk or blocked','#ffe4c7',p=>/risk|block/i.test(p.health)||(!!p.risk&&p.st!==6)],
    ['nopic','No PIC yet','#e4ddff',p=>!p.pics.length&&p.st!==6&&p.st!==-2],
    ['nopri','No priority','#d8f3ff',p=>!p.pri&&p.st!==6&&p.st!==-2],
    ['stuck','Waiting 30+ days','#dcf8e6',p=>{const d=daysSince(p.since);return d!=null&&d>=30&&p.st!==6}],
  ];
  const sel=buckets.find(b=>b[0]===S.love);
  return `<div class="secttl"><h3>Needs a little love</h3><span class="sub">tidy these and the board shines</span></div>
  <div class="lovegrid">${buckets.map(([k,l,bg,f])=>`<div class="lovecard ${S.love===k?'on':''}" data-love="${k}" style="background:${bg}"><div class="big">${S.P.filter(f).length}</div><div class="l">${l}</div></div>`).join('')}</div>
  ${sel?`<div class="secttl"><h3>${sel[1]}</h3></div><div class="reqs">${S.P.filter(sel[3]).map(ticket).join('')||'<div class="empty">All clear here. Nice!</div>'}</div>`:'<div class="empty">Tap a card to see the projects inside.</div>'}`;
}

function viewInbox(){
  if(!S.reqId) return '<div class="empty">No request table found in this base.</div>';
  const types=[...new Set(S.R.map(r=>r.type).filter(Boolean))], tc=['#ff6f91','#7c5cff','#2ec4b6','#ff9f1c','#4d96ff'];
  return `<div class="secttl"><h3>Request inbox</h3><span class="sub">${S.R.length} received</span></div>
  <div class="lovegrid">${types.map((t,i)=>`<div class="lovecard" style="background:${tc[i%5]}26"><div class="big" style="color:${tc[i%5]}">${S.R.filter(r=>r.type===t).length}</div><div class="l">${esc(t)}</div></div>`).join('')}</div>
  <div class="reqs" style="margin-top:12px">${S.R.slice(0,40).map(r=>`<div class="req" data-req="${r.id}"><span class="dot" style="background:${tc[Math.max(0,types.indexOf(r.type))%5]}"></span><div style="flex:1"><div class="tt">${esc(r.title)}</div><div class="s">${[r.type,r.team,r.by].filter(Boolean).map(esc).join(' · ')}</div></div><div class="s">${fmt(r.date)}</div></div>`).join('')||'<div class="empty">The inbox is empty. Peaceful!</div>'}</div>`;
}

function render(){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  $('#main').innerHTML = S.tab==='journey'?viewJourney():S.tab==='crew'?viewCrew():S.tab==='love'?viewLove():viewInbox();
  const base=S.name.replace(/\s*-\s*project tracker/i,'').trim();
  $('#title').textContent=(base&&base!==S.name?base+' ':'')+'Project Hub';
  document.title=$('#title').textContent;
  $('#tag').textContent=`${S.P.length} projects · live`;
  const q=$('#q'); if(q) q.oninput=e=>{S.q=e.target.value;const pos=e.target.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(pos,pos);};
}

document.addEventListener('click', async e=>{
  const d=e.target.closest('.tabs button'); if(d){S.tab=d.dataset.tab;render();scrollTo(0,0);return;}
  const st=e.target.closest('.stop'); if(st){S.open=+st.dataset.st;S.q='';render();return;}
  const pe=e.target.closest('[data-person]'); if(pe){S.person=S.person===pe.dataset.person?null:pe.dataset.person;render();return;}
  const lv=e.target.closest('[data-love]'); if(lv){ if(S.tab!=='love'){S.tab='love';S.love=lv.dataset.love;} else S.love=S.love===lv.dataset.love?null:lv.dataset.love; render(); return;}
  if(e.target.closest('#saveCfg')){ try{
      const custom = {tableId:S.tableId,tableName:S.name};
      const tries = [ {dataConditions:[],customConfig:custom}, {dataConditions:[{tableId:S.tableId}],customConfig:custom} ];
      let ok=false, last;
      for (const cfg of tries){ try { const r = await bitable.dashboard.saveConfig(cfg); if (r!==false){ ok=true; break; } } catch(err){ last=err; } }
      toast(ok?'Saved!':'Could not save: '+(last?.message||last||'unknown'));
    }catch(err){ toast('Could not save: '+(err?.message||err)); } return; }
  const c=e.target.closest('[data-id],[data-req]');
  if(c){const tableId=c.dataset.id?S.tableId:S.reqId, recordId=c.dataset.id||c.dataset.req;
    if(HAS_API){ if(CFG.baseUrl) window.open(`${CFG.baseUrl}${CFG.baseUrl.includes('?')?'&':'?'}table=${tableId}&record=${recordId}`,'_blank'); else toast('Ask the owner to set BASE_URL'); return; }
    try{await bitable.ui.showRecordDetailDialog({tableId,recordId});}catch{try{await bitable.ui.switchToTable(tableId);}catch{toast('Open the table to see this one');}}}
});
$('#fab').onclick=async()=>{
  if(HAS_API){ const u=CFG.formUrl||CFG.baseUrl; if(u) window.open(u,'_blank'); else toast('Ask the owner to set FORM_URL'); return; }
  try{await bitable.ui.switchToTable(S.reqId||S.tableId);toast('Off to the request table!');}catch{toast('Open the request form from the sidebar');}};
$('#refresh').onclick=()=>boot(S.tableId,true);
$('#tablePick').onchange=e=>{ls('ph_table',e.target.value);boot(e.target.value);};

function dashState(){ if (HAS_API) return null; try { return bitable.dashboard?.state || null; } catch { return null; } }
async function boot(id,quiet){
  try{
    if (HAS_API && !CFG.loaded) { try { CFG = await j('/api/config'); CFG.loaded = true; } catch(e){ if (e instanceof NeedLogin) throw e; } }
    const ds = dashState();
    if (!id && ds && ds!=='Create') { try { const c = await bitable.dashboard.getConfig(); id = c?.customConfig?.tableId || c?.dataConditions?.[0]?.tableId; } catch {} }
    await load(id); render();
    $('#cfg').innerHTML = (ds==='Create'||ds==='Config') ? `<div class="cfgbar"><span>Looks good? Pick the project table above, then save to place the hub here.</span><div class="grow"></div><button id="saveCfg">Save hub</button></div>` : '';
    if (ds) { try { await bitable.dashboard.setRendered(); } catch {} }
    if(quiet) toast('Fresh data loaded');
  }
  catch(err){
    if (err instanceof NeedLogin) { showLogin(); return; }
    console.error(err); $('#main').innerHTML=`<div class="empty"><b>Could not read the base.</b><br>${HAS_API?'The server could not reach Lark. Try signing in again.':'Open this page inside Lark.'}<br><small>${esc(err?.message||err)}</small>${HAS_API?'<br><br><a class="newbtn" href="/api/login" style="text-decoration:none;display:inline-block">Sign in again</a>':''}</div>`; }
}
boot();
</script>
</body>
</html>
